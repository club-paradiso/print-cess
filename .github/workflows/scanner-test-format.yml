name: Scanner Test Format

on:
  push:
    branches: [feat/pro-grade-document-scanner]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pro-grade-document-scanner
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/lib/scan-pdf-roundtrip.test.ts apps/web/src/lib/scan-quality-adversarial.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/scan-pdf-roundtrip.test.ts apps/web/src/lib/scan-quality-adversarial.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(scan): format quality verification tests'
          git push origin HEAD:feat/pro-grade-document-scanner
