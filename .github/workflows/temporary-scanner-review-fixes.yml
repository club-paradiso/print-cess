name: Temporary scanner review fixes

on:
  push:
    branches:
      - feat/document-scanner

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply scanner review fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              p.write_text(updated)

          sub_once(
              "apps/web/src/components/scan/scan-composer.tsx",
              r'''    if \(typeof createImageBitmap === "function"\) \{\n      const bitmap = await createImageBitmap\(file, \{ imageOrientation: "from-image" \}\);\n      image = bitmap;\n      width = bitmap\.width;\n      height = bitmap\.height;\n      release = \(\) => bitmap\.close\(\);\n    \} else \{\n      const loaded = await loadImage\(file\);\n      image = loaded\.image;\n      width = loaded\.image\.naturalWidth;\n      height = loaded\.image\.naturalHeight;\n      release = loaded\.release;\n    \}''',
              '''    if (typeof createImageBitmap === "function") {
              try {
                const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
                image = bitmap;
                width = bitmap.width;
                height = bitmap.height;
                release = () => bitmap.close();
              } catch {
                const loaded = await loadImage(file);
                image = loaded.image;
                width = loaded.image.naturalWidth;
                height = loaded.image.naturalHeight;
                release = loaded.release;
              }
            } else {
              const loaded = await loadImage(file);
              image = loaded.image;
              width = loaded.image.naturalWidth;
              height = loaded.image.naturalHeight;
              release = loaded.release;
            }''',
          )

          sub_once(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              r'''  const chooseFile = useCallback\(\n.*?\n  \);\n\n  const print = useCallback''',
              '''  const chooseFile = useCallback(
            async (
              selected: File | undefined,
              options: { trustedGeneratedPdf?: boolean } = {},
            ) => {
              if (!selected) return false;
              try {
                setFileErrorKey(undefined);
                setFileNoticeKey(undefined);
                const result = await validateMobileDocument(selected, {
                  allowHwp: supportsHwp,
                  allowHwpx: supportsHwpx,
                  trustedGeneratedPdf: options.trustedGeneratedPdf,
                });
                setFile(selected);
                setValidated(result);
                setStage("preview");
                return true;
              } catch (error) {
                clearDocument();
                setFileErrorKey(error instanceof FileValidationError ? error.code : "damagedFile");
                return false;
              }
            },
            [clearDocument, supportsHwp, supportsHwpx],
          );

          const print = useCallback''',
              re.S,
          )

          sub_once(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              r'''onComplete=\{async \(scanned\) => \{\s*setScannerOpen\(false\);\s*await chooseFile\(scanned\);\s*\}\}''',
              '''onComplete={async (scanned) => {
            const accepted = await chooseFile(scanned, { trustedGeneratedPdf: true });
            if (accepted) setScannerOpen(false);
          }}''',
          )

          sub_once(
              "apps/web/src/lib/mobile-document-validation.ts",
              r'''options: \{ allowHwp\?: boolean; allowHwpx\?: boolean \} = \{\},''',
              'options: { allowHwp?: boolean; allowHwpx?: boolean; trustedGeneratedPdf?: boolean } = {},',
          )
          sub_once(
              "apps/web/src/lib/mobile-document-validation.ts",
              r'''  if \(!isHwpSelection\(file\)\) \{\n    return options\.allowHwpx === undefined\n      \? validateFileForMobile\(file\)\n      : validateFileForMobile\(file, \{ allowHwpx: options\.allowHwpx \}\);\n  \}''',
              '''  if (!isHwpSelection(file)) {
            return validateFileForMobile(file, {
              allowHwpx: options.allowHwpx,
              trustedGeneratedPdf: options.trustedGeneratedPdf,
            });
          }''',
          )

          sub_once(
              "apps/web/src/lib/file-validation.ts",
              r'''options: \{ allowHwpx\?: boolean \} = \{\},''',
              'options: { allowHwpx?: boolean; trustedGeneratedPdf?: boolean } = {},',
          )
          sub_once(
              "apps/web/src/lib/file-validation.ts",
              r'''pageCount: await validatePdf\(bytes\),''',
              'pageCount: await validatePdf(bytes, { skipActiveContentScan: options.trustedGeneratedPdf }),',
          )
          sub_once(
              "apps/web/src/lib/file-validation.ts",
              r'''export async function validatePdf\(bytes: Uint8Array\): Promise<number> \{''',
              '''export async function validatePdf(
            bytes: Uint8Array,
            options: { skipActiveContentScan?: boolean } = {},
          ): Promise<number> {''',
          )
          sub_once(
              "apps/web/src/lib/file-validation.ts",
              r'''  if \(\n    ACTIVE_PDF_MARKERS\.some\(\n      \(marker\) => searchable\.includes\(marker\) \|\| decodedNames\.includes\(marker\),\n    \)\n  \)\n    throw new FileValidationError\("damagedFile"\);''',
              '''  if (
            !options.skipActiveContentScan &&
            ACTIVE_PDF_MARKERS.some(
              (marker) => searchable.includes(marker) || decodedNames.includes(marker),
            )
          )
            throw new FileValidationError("damagedFile");''',
          )
      - name: Format changed files
        run: pnpm exec prettier --write apps/web/src/components/scan/scan-composer.tsx apps/web/src/components/mobile/mobile-flow.tsx apps/web/src/lib/mobile-document-validation.ts apps/web/src/lib/file-validation.ts apps/web/src/components/scan/scan-copy.ts
      - name: Verify repository checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit and push fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/scan/scan-composer.tsx apps/web/src/components/mobile/mobile-flow.tsx apps/web/src/lib/mobile-document-validation.ts apps/web/src/lib/file-validation.ts apps/web/src/components/scan/scan-copy.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(scan): address scanner validation review findings"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
