name: Temporary scanner review fixes

on:
  push:
    branches:
      - feat/document-scanner

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply scanner review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/src/components/scan/scan-composer.tsx",
              '''    if (typeof createImageBitmap === "function") {
                const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
                image = bitmap;
                width = bitmap.width;
                height = bitmap.height;
                release = () => bitmap.close();
              } else {
                const loaded = await loadImage(file);
                image = loaded.image;
                width = loaded.image.naturalWidth;
                height = loaded.image.naturalHeight;
                release = loaded.release;
              }'''.replace('              ', '    ', 1),
              '''    if (typeof createImageBitmap === "function") {
                try {
                  const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
                  image = bitmap;
                  width = bitmap.width;
                  height = bitmap.height;
                  release = () => bitmap.close();
                } catch {
                  const loaded = await loadImage(file);
                  image = loaded.image;
                  width = loaded.image.naturalWidth;
                  height = loaded.image.naturalHeight;
                  release = loaded.release;
                }
              } else {
                const loaded = await loadImage(file);
                image = loaded.image;
                width = loaded.image.naturalWidth;
                height = loaded.image.naturalHeight;
                release = loaded.release;
              }'''.replace('              ', '    ', 1),
          )

          replace_once(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              '''  const chooseFile = useCallback(
                async (selected: File | undefined) => {
                  if (!selected) return;
                  try {
                    setFileErrorKey(undefined);
                    setFileNoticeKey(undefined);
                    const result = await validateMobileDocument(selected, {
                      allowHwp: supportsHwp,
                      allowHwpx: supportsHwpx,
                    });
                    setFile(selected);
                    setValidated(result);
                    setStage("preview");
                  } catch (error) {
                    clearDocument();
                    setFileErrorKey(error instanceof FileValidationError ? error.code : "damagedFile");
                  }
                },
                [clearDocument, supportsHwp, supportsHwpx],
              );'''.replace('              ', '', 1),
              '''  const chooseFile = useCallback(
                async (
                  selected: File | undefined,
                  options: { trustedGeneratedPdf?: boolean } = {},
                ) => {
                  if (!selected) return false;
                  try {
                    setFileErrorKey(undefined);
                    setFileNoticeKey(undefined);
                    const result = await validateMobileDocument(selected, {
                      allowHwp: supportsHwp,
                      allowHwpx: supportsHwpx,
                      trustedGeneratedPdf: options.trustedGeneratedPdf,
                    });
                    setFile(selected);
                    setValidated(result);
                    setStage("preview");
                    return true;
                  } catch (error) {
                    clearDocument();
                    setFileErrorKey(error instanceof FileValidationError ? error.code : "damagedFile");
                    return false;
                  }
                },
                [clearDocument, supportsHwp, supportsHwpx],
              );'''.replace('              ', '', 1),
          )

          replace_once(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              '''          onComplete={async (scanned) => {
                        setScannerOpen(false);
                        await chooseFile(scanned);
                      }}'''.replace('                      ', '          ', 1),
              '''          onComplete={async (scanned) => {
                        const accepted = await chooseFile(scanned, { trustedGeneratedPdf: true });
                        if (accepted) setScannerOpen(false);
                      }}'''.replace('                      ', '          ', 1),
          )

          replace_once(
              "apps/web/src/lib/mobile-document-validation.ts",
              'options: { allowHwp?: boolean; allowHwpx?: boolean } = {},',
              'options: { allowHwp?: boolean; allowHwpx?: boolean; trustedGeneratedPdf?: boolean } = {},',
          )
          replace_once(
              "apps/web/src/lib/mobile-document-validation.ts",
              '''  if (!isHwpSelection(file)) {
                return options.allowHwpx === undefined
                  ? validateFileForMobile(file)
                  : validateFileForMobile(file, { allowHwpx: options.allowHwpx });
              }'''.replace('              ', '', 1),
              '''  if (!isHwpSelection(file)) {
                return validateFileForMobile(file, {
                  allowHwpx: options.allowHwpx,
                  trustedGeneratedPdf: options.trustedGeneratedPdf,
                });
              }'''.replace('              ', '', 1),
          )

          replace_once(
              "apps/web/src/lib/file-validation.ts",
              'options: { allowHwpx?: boolean } = {},',
              'options: { allowHwpx?: boolean; trustedGeneratedPdf?: boolean } = {},',
          )
          replace_once(
              "apps/web/src/lib/file-validation.ts",
              'pageCount: await validatePdf(bytes),',
              'pageCount: await validatePdf(bytes, { skipActiveContentScan: options.trustedGeneratedPdf }),',
          )
          replace_once(
              "apps/web/src/lib/file-validation.ts",
              'export async function validatePdf(bytes: Uint8Array): Promise<number> {',
              '''export async function validatePdf(
                bytes: Uint8Array,
                options: { skipActiveContentScan?: boolean } = {},
              ): Promise<number> {'''.replace('              ', '', 1),
          )
          replace_once(
              "apps/web/src/lib/file-validation.ts",
              '''  if (
                ACTIVE_PDF_MARKERS.some(
                  (marker) => searchable.includes(marker) || decodedNames.includes(marker),
                )
              )
                throw new FileValidationError("damagedFile");'''.replace('              ', '', 1),
              '''  if (
                !options.skipActiveContentScan &&
                ACTIVE_PDF_MARKERS.some(
                  (marker) => searchable.includes(marker) || decodedNames.includes(marker),
                )
              )
                throw new FileValidationError("damagedFile");'''.replace('              ', '', 1),
          )
      - name: Format changed files
        run: pnpm exec prettier --write apps/web/src/components/scan/scan-composer.tsx apps/web/src/components/mobile/mobile-flow.tsx apps/web/src/lib/mobile-document-validation.ts apps/web/src/lib/file-validation.ts apps/web/src/components/scan/scan-copy.ts
      - name: Verify web tests and typecheck
        run: |
          pnpm --filter @print-cess/web test
          pnpm --filter @print-cess/web typecheck
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/scan/scan-composer.tsx apps/web/src/components/mobile/mobile-flow.tsx apps/web/src/lib/mobile-document-validation.ts apps/web/src/lib/file-validation.ts apps/web/src/components/scan/scan-copy.ts
          if git diff --cached --quiet; then
            echo "No scanner review changes required"
            exit 0
          fi
          git commit -m "fix(scan): address scanner validation review findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
