name: Scanner Glare Fix

on:
  push:
    branches: [feat/pro-grade-document-scanner]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pro-grade-document-scanner
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Improve localized glare detection
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/src/lib/document-scan-engine.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('const tileColumns = 6;\n  const tileRows = 8;', 'const tileColumns = 8;\n  const tileRows = 10;');
          source = source.replace(
            'if (ratio > 0.58 && ratio < 0.985) glare = Math.max(glare, ratio);',
            '// A fully clipped local tile is the strongest glare signal. Whole-frame\n    // overexposure is classified earlier by the average brightness gate.\n    if (ratio > 0.58) glare = Math.max(glare, ratio);',
          );
          fs.writeFileSync(path, source);
          NODE
      - run: pnpm exec prettier --write apps/web/src/lib/document-scan-engine.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/document-scan-engine.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(scan): detect compact clipped glare regions'
          git push origin HEAD:feat/pro-grade-document-scanner
