name: Temporary browserslist lockfile fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/production-dependencies-e41071ab84

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Pin patched browserslist in pnpm workspace and regenerate lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.pnpm?.overrides?.browserslist) delete pkg.pnpm.overrides.browserslist;
          if (pkg.pnpm?.overrides && Object.keys(pkg.pnpm.overrides).length === 0) delete pkg.pnpm.overrides;
          if (pkg.pnpm && Object.keys(pkg.pnpm).length === 0) delete pkg.pnpm;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          if (!/^\s{2}browserslist:\s*4\.28\.7\s*$/m.test(workspace)) {
            workspace = workspace.replace(/^overrides:\s*$/m, 'overrides:\n  browserslist: 4.28.7');
          }
          fs.writeFileSync(workspacePath, workspace);
          NODE
          pnpm install --lockfile-only
      - name: Commit generated dependency fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git commit -m "fix(security): pin patched browserslist in pnpm workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
