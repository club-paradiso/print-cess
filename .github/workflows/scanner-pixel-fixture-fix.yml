name: Scanner Pixel Fixture Fix

on:
  push:
    branches: [feat/pro-grade-document-scanner]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pro-grade-document-scanner
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Make scanner pixel fixtures runtime-independent
        run: |
          node <<'NODE'
          const fs = require('fs');

          const enginePath = 'apps/web/src/lib/document-scan-engine.ts';
          let engine = fs.readFileSync(enginePath, 'utf8');
          if (!engine.includes('export type ScanPixelData')) {
            engine = engine.replace(
              'export type ScanPoint = { x: number; y: number };',
              'export type ScanPoint = { x: number; y: number };\nexport type ScanPixelData = { data: Uint8ClampedArray; width: number; height: number };',
            );
          }
          engine = engine.replace(/imageData: ImageData,/g, 'imageData: ScanPixelData,');
          fs.writeFileSync(enginePath, engine);

          const direct = [
            'apps/web/src/lib/document-scan-engine.test.ts',
            'apps/web/src/lib/scan-quality-adversarial.test.ts',
          ];
          for (const path of direct) {
            let source = fs.readFileSync(path, 'utf8');
            source = source.replace(/return new ImageData\(data, width, height\);/g, 'return { data, width, height };');
            fs.writeFileSync(path, source);
          }

          const capturePath = 'apps/web/src/lib/scan-capture-quality.test.ts';
          let capture = fs.readFileSync(capturePath, 'utf8');
          capture = capture.replace(/return new ImageData\(bytes, width, height\);/g, 'return { data: bytes, width, height };');
          fs.writeFileSync(capturePath, capture);
          NODE
      - run: >-
          pnpm exec prettier --write
          apps/web/src/lib/document-scan-engine.ts
          apps/web/src/lib/document-scan-engine.test.ts
          apps/web/src/lib/scan-capture-quality.test.ts
          apps/web/src/lib/scan-quality-adversarial.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/document-scan-engine.ts apps/web/src/lib/document-scan-engine.test.ts apps/web/src/lib/scan-capture-quality.test.ts apps/web/src/lib/scan-quality-adversarial.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(scan): make pixel fixtures runtime-independent'
          git push origin HEAD:feat/pro-grade-document-scanner
