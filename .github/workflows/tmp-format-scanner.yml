name: Temporary scanner formatter

on:
  push:
    branches: [feat/scanner-quality-benchmark]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/scanner-quality-benchmark
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/scanner-benchmark/metrics.mjs
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/scanner-benchmark/metrics.mjs
          git commit -m "style(scan): apply prettier to benchmark metrics"
          git push origin HEAD:feat/scanner-quality-benchmark
